name: Lint & Test — dark-text-overlay

on:
  push:
    paths:
      - 'dark-text-overlay/**'
  pull_request:
    paths:
      - 'dark-text-overlay/**'

jobs:
  lint-and-test:
    name: ESLint + Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dark-text-overlay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-text-overlay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
